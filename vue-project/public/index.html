<body>
  <noscript>
    <!-- JS無効環境向けSEOコンテンツ（クローラーも参照する） -->
    <header>
      <h1>プロ野球 対戦成績 検索｜投手VS打者の相性検索（NPB）</h1>
    </header>
    <main>
      <p>プロ野球（NPB）の投手と打者の対戦成績を選手別に検索できる無料ツールです。打率・本塁打・打席数などの個人対戦データを、年度別または通算（2016年以降）で表示し、投手と打者の相性を分析できます。</p>
      <section>
        <h2>プロ野球 対戦成績検索でできること</h2>
        <ul>
          <li>投手と打者の対戦成績（打率・本塁打・打席数）を個人別に検索</li>
          <li>セ・リーグ／パ・リーグ全12球団・全選手に対応</li>
          <li>年度別検索（2016年以降）と通算対戦成績検索</li>
          <li>投手別・打者別の対戦成績一覧の表示</li>
          <li>投手の得意な打者・苦手な打者の傾向把握</li>
          <li>打者の得意な投手・苦手な投手の傾向把握</li>
        </ul>
      </section>
      <section>
        <h2>対応している球団（NPB全12球団）</h2>
        <h3>セントラル・リーグ</h3>
        <p>読売ジャイアンツ（巨人）、阪神タイガース、横浜DeNAベイスターズ、広島東洋カープ、東京ヤクルトスワローズ、中日ドラゴンズ</p>
        <h3>パシフィック・リーグ</h3>
        <p>福岡ソフトバンクホークス、北海道日本ハムファイターズ、千葉ロッテマリーンズ、東北楽天ゴールデンイーグルス、オリックス・バファローズ、埼玉西武ライオンズ</p>
      </section>
      <section>
        <h2>表示される対戦成績データ</h2>
        <p>投手と打者ごとに、打席数・打数・安打・本塁打・打点・四球・三振・打率・出塁率・長打率・OPSなど、プロ野球の主要な対戦成績指標を表示します。</p>
      </section>
      <section>
        <h2>ゾーン別対戦成績（コース別打率・ヒートマップ）</h2>
        <p>投手×打者の対戦詳細画面では、打者目線の5×5ゾーン（コース別）打率・安打数・打数を表示します。ストライクゾーン9マス＋ボールゾーン16マスの計25マスでヒートマップ化し、得意ゾーン・苦手ゾーンを可視化できます。</p>
      </section>
      <p><strong>このアプリは JavaScript が必須です。ブラウザ設定で有効化してください。</strong></p>
