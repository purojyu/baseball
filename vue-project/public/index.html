<body>

    <main>
      <p>プロ野球（NPB）の投手 × 打者の対戦成績を選手別に検索する画面です。</p>
      <section>
        <h2>このサイトでできること</h2>
        <ul>
          <li>投手と打者を指定して対戦成績（打率・本塁打・打席数など）を検索</li>
